<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher: Ms Mai Thuy - End-of-Month Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ORIGINAL DORAEMON COLOR PALETTE */
            --dora-blue: #00A0E9;
            --dora-dark-blue: #006b9e;
            --dora-red: #E3001B;
            --dora-yellow: #FFD900;
            --dora-yellow-dark: #D4B500;
            --dora-white: #FFFFFF;
            
            --correct: #00D26A; 
            --incorrect: #FF4757; 
            --bg-card: rgba(255, 255, 255, 0.98);
            --text-dark: #2D3436;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        body {
            background-color: var(--dora-blue);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 50px 10px 30px 10px;
            -webkit-font-smoothing: antialiased;
        }

        /* DORAEMON COLLAR & BELL */
        .doraemon-collar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 35px;
            background-color: var(--dora-red);
            border-bottom: 3px solid #b30015;
            z-index: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .doraemon-bell {
            position: fixed;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            width: 75px; height: 75px;
            background-color: var(--dora-yellow);
            border-radius: 50%;
            border: 4px solid var(--dora-yellow-dark);
            z-index: 1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .doraemon-bell:hover {
            transform: translateX(-50%) rotate(15deg) scale(1.1);
        }
        .doraemon-bell::before {
            content: ''; position: absolute;
            top: 20px; left: -5px; right: -5px;
            height: 5px; background: var(--dora-yellow-dark);
        }
        .doraemon-bell::after {
            content: ''; position: absolute;
            top: 35px; left: 50%; transform: translateX(-50%);
            width: 14px; height: 14px;
            background: var(--dora-yellow-dark); border-radius: 50%;
        }
        .doraemon-bell-line {
            position: absolute;
            top: 45px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 25px; background: var(--dora-yellow-dark);
            z-index: 2;
        }

        /* Floating Stickers */
        .pattern {
            position: fixed;
            z-index: -1;
            opacity: 0.9;
            animation: float-soft 6s ease-in-out infinite;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
        }
        @keyframes float-soft {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        #app-container { max-width: 900px; margin: 0 auto; position: relative; z-index: 10; }

        .card {
            background: var(--bg-card);
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            border: 5px solid var(--dora-white);
        }

        h1, h2, h3 { color: var(--dora-blue); font-weight: 900; }
        .header-small { font-size: 15px; color: var(--dora-white); text-align: right; font-weight: 900; margin-bottom: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);}
        
        /* Start Screen */
        #start-screen { text-align: center; margin-top: 6vh; }
        input[type="text"] {
            padding: 16px 25px;
            font-size: 20px;
            border-radius: 20px;
            border: 3px solid var(--dora-blue);
            width: 80%;
            max-width: 400px;
            margin: 20px 0;
            outline: none;
            font-weight: bold;
            color: var(--dora-dark-blue);
            background-color: #F0F8FF;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            background-color: #FFF;
            box-shadow: 0 0 15px rgba(0, 160, 233, 0.4);
        }
        .btn {
            background: var(--dora-red);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b30015;
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(8px); box-shadow: 0 0 0 #b30015; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* Top Bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 45px;
            z-index: 100;
            border: 3px solid var(--dora-blue);
            padding: 15px 25px;
        }
        #timer {
            background: var(--dora-yellow);
            color: #D35400;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 5px 0 var(--dora-yellow-dark);
            border: 2px solid #FFF;
        }
        .timer-warning { color: var(--incorrect) !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Highlight tool */
        #highlight-btn {
            background: #ffffff;
            color: var(--dora-dark-blue);
            border: 2px solid var(--dora-dark-blue);
            padding: 10px 18px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--dora-dark-blue);
            transition: 0.1s;
        }
        #highlight-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--dora-dark-blue); }
        .highlighted { background-color: var(--dora-yellow); color: #D35400; border-radius: 5px; padding: 2px 4px;}

        /* Question Styles */
        .question-block { margin-bottom: 35px; padding-bottom: 25px; border-bottom: 3px dashed #E0F4FF; }
        .question-text { font-size: 19px; font-weight: bold; margin-bottom: 15px; line-height: 1.6; color: #2D3436; }
        .question-img { max-width: 100%; max-height: 350px; border-radius: 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); margin-bottom: 15px; display: block; border: 3px solid #FFF;}
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .option {
            background: #FFFFFF;
            border: 3px solid #DFE6E9;
            border-radius: 20px;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 0 #DFE6E9;
            color: #2D3436;
        }
        .option:hover:not(.disabled) { transform: scale(1.03); border-color: var(--dora-blue); color: var(--dora-dark-blue);}
        .option.correct { background: var(--correct) !important; color: #006B3C !important; border-color: #00B894 !important; box-shadow: 0 5px 0 #00B894 !important;}
        .option.incorrect { background: var(--incorrect) !important; color: white !important; border-color: #D63031 !important; box-shadow: 0 5px 0 #D63031 !important;}
        .option.disabled { cursor: not-allowed; opacity: 0.9; }

        /* Specific Types */
        .audio-player { width: 100%; margin: 15px 0; border-radius: 15px; outline: none; }
        .audio-player::-webkit-media-controls-panel { background-color: #E0F4FF; }
        
        .image-card {
            display: inline-block; text-align: center; margin: 10px; padding: 15px;
            border: 3px solid var(--dora-blue); border-radius: 20px; background: #FFF;
            box-shadow: 0 6px 15px rgba(0, 160, 233, 0.15);
        }
        .image-card span { font-size: 45px; display: block; margin-bottom: 10px;}
        .input-gap { border: 3px solid var(--dora-blue); border-radius: 12px; padding: 8px 12px; font-size: 18px; outline: none; font-weight: bold; width: 150px; color: var(--dora-dark-blue); background: #F8F9FA;}
        
        .word-bank { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; background: #F0F8FF; padding: 15px; border-radius: 15px; border: 2px dashed var(--dora-blue);}
        .word-chip { background: var(--dora-white); color: var(--dora-dark-blue); border: 2px solid var(--dora-blue); padding: 8px 18px; border-radius: 20px; font-weight: 900; font-size: 16px; box-shadow: 0 3px 0 var(--dora-blue);}
        
        /* Reorder game */
        .reorder-zone { min-height: 60px; border: 3px dashed var(--dora-blue); border-radius: 15px; padding: 15px; display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 15px; background: #F0F8FF;}
        .word-draggable { background: var(--dora-yellow); color: #D35400; padding: 12px 18px; border-radius: 15px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 var(--dora-yellow-dark); transition: 0.1s;}
        .word-draggable:active { transform: translateY(5px); box-shadow: 0 0 0 var(--dora-yellow-dark); }

        /* Explanations */
        .explanation {
            display: none;
            background: #F0F8FF;
            border-left: 6px solid var(--dora-blue);
            padding: 20px;
            margin-top: 20px;
            border-radius: 0 20px 20px 0;
            font-size: 16px;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .explanation h4 { color: var(--dora-red); margin-bottom: 10px; font-size: 18px;}
        .explanation ul { margin-left: 20px; margin-bottom: 10px; }

        /* Check buttons for text/reorder inputs */
        .check-btn {
            background: var(--dora-blue); color: white; border: none; padding: 8px 20px;
            border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 0 #006b9e; transition: all 0.1s;
        }
        .check-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #006b9e; }
        .check-btn:hover { filter: brightness(1.1); }

        /* Report Screen */
        #report-screen { display: none; }
        .score-board { text-align: center; font-size: 40px; color: var(--dora-red); font-weight: 900; margin: 25px 0; }
        .matrix-table { width: 100%; border-collapse: collapse; margin: 25px 0; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);}
        .matrix-table th, .matrix-table td { border: 2px solid #E2E8F0; padding: 15px; text-align: left; }
        .matrix-table th { background: var(--dora-blue); color: white; font-size: 18px;}
        .badge { padding: 6px 12px; border-radius: 15px; font-weight: 900; color: white; font-size: 13px; }
        .badge.mastered { background: var(--correct); color: #006B3C;}
        .badge.practice { background: var(--dora-yellow); color: #D35400; }
        .badge.weakness { background: var(--incorrect); }
        .root-cause { background: #FFF9E6; padding: 25px; border-radius: 20px; border-left: 6px solid var(--dora-yellow-dark); }

        /* Confetti Canvas */
        #confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
    <!-- Doraemon Floating Elements -->
    <div style="font-size:55px; position:fixed; top:12%; left:5%;" class="pattern">🚁</div>
    <div style="font-size:60px; position:fixed; top:40%; right:8%; animation-delay: 1.5s;" class="pattern">☁️</div>
    <div style="font-size:50px; position:fixed; bottom:15%; left:8%; animation-delay: 2.5s;" class="pattern">🚪</div>
    <div style="font-size:55px; position:fixed; top:25%; right:18%; animation-delay: 0.8s;" class="pattern">🥞</div>
    <div style="font-size:45px; position:fixed; bottom:30%; right:10%; animation-delay: 3s;" class="pattern">⭐</div>

    <!-- Doraemon Collar & Bell -->
    <div class="doraemon-collar"></div>
    <div class="doraemon-bell">
        <div class="doraemon-bell-line"></div>
    </div>

    <canvas id="confetti"></canvas>

    <div id="app-container">
        <div class="header-small">Teacher: Ms Mai Thuy</div>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="card">
            <h1 style="color: var(--dora-blue); font-size: 38px;">End-of-Month Test ✨</h1>
            <h2 style="color: var(--dora-red); font-size: 24px;">Grade 5 - Global Success</h2>
            <p style="margin-top: 20px; font-size: 20px; font-weight: bold; color: #636e72;">Enter your name to start! (42 Questions)</p>
            <input type="text" id="student-name" placeholder="Your name..." autocomplete="off">
            <br>
            <button class="btn" onclick="startTest()">START 🚀</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" style="display: none;">
            <div id="top-bar" class="card" style="padding: 18px 25px;">
                <div style="font-weight: 900; font-size: 20px; color: var(--dora-dark-blue);">Student: <span id="display-name" style="color: var(--dora-red);"></span></div>
                <button id="highlight-btn" onclick="toggleHighlight()">🖍️ Bật / Tắt tô sáng</button>
                <div id="timer">45:00</div>
            </div>

            <div class="card" id="questions-container">
                <!-- Questions generated by JS -->
            </div>

            <div style="text-align: center;">
                <button class="btn" id="submit-btn" style="background: var(--dora-blue); box-shadow: 0 8px 0 #006b99; padding: 18px 50px;" onclick="submitTest()">SUBMIT TEST 🏆</button>
            </div>
        </div>

        <!-- REPORT SCREEN -->
        <div id="report-screen" class="card">
            <h1 style="text-align: center; color: var(--dora-dark-blue); font-size: 36px;">🎉 SCORE REPORT 🎉</h1>
            <div class="score-board">
                <span id="final-name" style="color: var(--dora-dark-blue);"></span> scored: <br>
                <span id="final-score" style="font-size: 60px; color: var(--dora-red); text-shadow: 2px 2px 0px #FFEAA7;"></span>
                <div id="final-score-10" style="font-size: 40px; color: var(--dora-blue); margin-top: 10px;"></div>
            </div>
            
            <h3>📊 Knowledge Matrix (42 Questions)</h3>
            <table class="matrix-table" id="matrix-body">
                <tr><th>Category</th><th>Accuracy</th><th>Level</th></tr>
                <!-- Generated by JS -->
            </table>

            <div class="root-cause">
                <h3 style="color: #D35400; font-size: 22px;">👩‍🏫 Teacher's Feedback:</h3>
                <p id="teacher-advice" style="margin-top: 12px; font-size: 18px; line-height: 1.6; font-weight: bold; color: var(--text-dark);"></p>
            </div>
        </div>
    </div>

<script>
const quizData = [

        id: "q1",

            whyCorrect: "Từ 'travel' là động từ 2 âm tiết nhưng kết thúc bằng âm nhẹ /əl/ nên nhấn âm 1[cite: 1].",

    // IV. Reading MCQ

        question: "5. Her brother lives in a building.",
        options: ["True", "False"],
        correct: 0,
        explanation: {
            translate: "Dịch: Anh trai của cô ấy sống trong một tòa nhà.",
            opts: ["True (Đúng)", "False (Sai)"],
            whyCorrect: "Trong bài đọc ghi rõ: 'My brother lives in a building in Da Nang.' -> Câu nhận định là Đúng[cite: 2].",
            whyIncorrect: "Câu khẳng định hoàn toàn khớp với chi tiết trong bài."
        }
    }
];

let isTestSubmitted = false;
let timerInterval;
let timeLeft = 2700; // 45 minutes
let isHighlighting = false;

// Audio Context Generation (No external files)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration, vol) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
}
function playCorrect() { playTone(600, 'sine', 0.5, 0.5); setTimeout(() => playTone(800, 'sine', 0.5, 0.5), 100); }
function playIncorrect() { playTone(300, 'sawtooth', 0.4, 0.5); setTimeout(() => playTone(250, 'sawtooth', 0.5, 0.5), 200); }

function shuffleArray(array) {
    let newArr = [...array];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
}

function toggleHighlight() {
    isHighlighting = !isHighlighting;
    const btn = document.getElementById('highlight-btn');
    if(isHighlighting) {
        btn.style.background = 'var(--dora-yellow)';
        btn.style.color = '#d35400';
        document.addEventListener('mouseup', applyHighlight);
    } else {
        btn.style.background = '#ffffff';
        btn.style.color = 'var(--dora-blue)';
        document.removeEventListener('mouseup', applyHighlight);
    }
}
function applyHighlight() {
    const selection = window.getSelection();
    if (!selection.isCollapsed) {
        const range = selection.getRangeAt(0);
        const span = document.createElement('span');
        span.className = 'highlighted';
        try {
            range.surroundContents(span);
        } catch(e) {}
        selection.removeAllRanges();
    }
}

function startTest() {
    const name = document.getElementById('student-name').value.trim();
    if (!name) { alert("Please enter your name!"); return; }
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('display-name').innerText = name;
    
    if(audioCtx.state === 'suspended') audioCtx.resume();
    renderQuestions();
    
    timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        let timerEl = document.getElementById('timer');
        timerEl.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        
        if (timeLeft <= 300) timerEl.classList.add('timer-warning');
        if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(); }
    }, 1000);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    
    quizData.forEach((q, index) => {
        let qHTML = `<div class="question-block" id="block-${q.id}">`;
        if (q.instruction) qHTML += `<h3 style="margin-bottom: 15px;">${q.instruction}</h3>`;
        if (q.question) qHTML += `<div class="question-text">${q.question}</div>`;

        if (q.type === 'mcq') {
            let shuffledOpts = shuffleArray(q.options.map((opt, i) => ({ text: opt, originalIndex: i })));
            qHTML += `<div class="options-grid">`;
            shuffledOpts.forEach(opt => {
                qHTML += `<div class="option" id="opt-${q.id}-${opt.originalIndex}" onclick="selectOption('${q.id}', ${opt.originalIndex})">${opt.text}</div>`;
            });
            qHTML += `</div>`;
        } 
        else if (q.type === 'matching') {
            qHTML += `<div style="display:flex; flex-wrap:wrap; gap:10px;">`;
            q.images.forEach(img => {
                qHTML += `<div class="image-card"><span style="font-weight:900; color:var(--dora-blue); font-size:24px;">${img.icon}</span>`;
                if(img.label) qHTML += `<span style="font-size:35px;">${img.label}</span>`;
                qHTML += `<br><input type="text" class="input-gap" id="match-${q.id}-${img.id}" placeholder="Number..." style="width:100px; text-align:center;"></div>`;
            });
            qHTML += `</div>`;
            qHTML += `<div style="margin-top:10px;"><button class="check-btn" onclick="checkMatchingImmediate('${q.id}')">Kiểm tra câu này 🔍</button></div>`;
        }
        else if (q.type === 'fill') {
            qHTML += `<div class="word-bank">Word bank: `;
            q.wordBank.forEach(w => qHTML += `<span class="word-chip">${w}</span>`);
            qHTML += `</div><div style="line-height:2.5; font-size:18px;">`;
            
            let text = q.question;
            for(let i=1; i<=q.correct.length; i++) {
                text = text.replace(`[${i}] ______`, `<input type="text" class="input-gap" id="fill-${q.id}-${i-1}">`);
            }
            qHTML += text + `</div>`;
            qHTML += `<div style="margin-top:10px;"><button class="check-btn" onclick="checkFillImmediate('${q.id}')">Kiểm tra câu này 🔍</button></div>`;
        }
        else if (q.type === 'input') {
            qHTML += `<input type="text" class="input-gap" id="input-${q.id}" style="width: 80%; max-width: 300px;">`;
            qHTML += `<div style="margin-top:10px;"><button class="check-btn" onclick="checkInputImmediate('${q.id}')">Kiểm tra câu này 🔍</button></div>`;
        }
        else if (q.type === 'reorder') {
            qHTML += `<div class="reorder-zone" id="zone-${q.id}"></div>`;
            qHTML += `<div class="word-bank" id="bank-${q.id}">`;
            shuffleArray(q.words).forEach(w => {
                qHTML += `<div class="word-draggable" onclick="moveWord(this, '${q.id}')">${w}</div>`;
            });
            qHTML += `</div>`;
            qHTML += `<div style="display:flex; gap:10px;"><button onclick="resetReorder('${q.id}')" style="padding:8px 15px; border-radius:10px; border:2px solid var(--dora-blue); background:#fff; font-weight:bold; color:var(--dora-blue); cursor:pointer;">Reset</button>`;
            qHTML += `<button class="check-btn" onclick="checkReorderImmediate('${q.id}')">Kiểm tra câu này 🔍</button></div>`;
        }

        qHTML += `<div class="explanation" id="exp-${q.id}">
            <h4>💡 Ms Mai Thùy's Explanation:</h4>
            <p style="margin-bottom:8px;">${q.explanation.translate}</p>
            <ul>${q.explanation.opts.map(o => `<li>${o}</li>`).join('')}</ul>
            <p style="color:var(--correct); margin-top:8px;"><b>✅ Vì sao đúng:</b> ${q.explanation.whyCorrect}</p>
            <p style="color:var(--incorrect); margin-top:8px;"><b>❌ Tránh bẫy:</b> ${q.explanation.whyIncorrect}</p>
        </div></div>`;
        
        container.innerHTML += qHTML;
    });
}

let userAnswers = {};

// Instant feedback for MCQ
function selectOption(qId, optIndex) {
    if (isTestSubmitted) return;
    const q = quizData.find(item => item.id === qId);
    if (!q) return;

    // Remove previous selection formatting
    document.querySelectorAll(`[id^="opt-${qId}"]`).forEach(el => el.classList.remove('selected', 'correct', 'incorrect'));
    
    const selectedEl = document.getElementById(`opt-${qId}-${optIndex}`);
    selectedEl.classList.add('selected');
    userAnswers[qId] = optIndex;

    // Immediate check
    if (optIndex === q.correct) {
        selectedEl.classList.add('correct');
        playCorrect();
    } else {
        selectedEl.classList.add('incorrect');
        const correctEl = document.getElementById(`opt-${qId}-${q.correct}`);
        if (correctEl) correctEl.classList.add('correct');
        playIncorrect();
        selectedEl.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration: 400});
    }

    // Show explanation immediately
    const expEl = document.getElementById(`exp-${qId}`);
    if (expEl) expEl.style.display = 'block';
}

function checkMatchingImmediate(qId) {
    if (isTestSubmitted) return;
    const q = quizData.find(item => item.id === qId);
    let allCorrect = true;

    for (let key in q.correct) {
        const inputEl = document.getElementById(`match-${qId}-${key}`);
        let val = inputEl.value.trim();
        if (val !== q.correct[key]) {
            allCorrect = false;
            inputEl.style.borderColor = 'var(--incorrect)';
            inputEl.style.backgroundColor = '#ffe6e6';
            if (!inputEl.parentNode.querySelector('.ans-hint')) {
                let cSpan = document.createElement('div');
                cSpan.className = 'ans-hint';
                cSpan.innerHTML = `<b style="color:var(--correct)">Answer: ${q.correct[key]}</b>`;
                inputEl.parentNode.appendChild(cSpan);
            }
        } else {
            inputEl.style.borderColor = 'var(--correct)';
            inputEl.style.backgroundColor = '#e6ffed';
        }
    }

    if (allCorrect) playCorrect(); else playIncorrect();
    const expEl = document.getElementById(`exp-${qId}`);
    if (expEl) expEl.style.display = 'block';
}

function checkFillImmediate(qId) {
    if (isTestSubmitted) return;
    const q = quizData.find(item => item.id === qId);
    let allCorrect = true;

    q.correct.forEach((ans, i) => {
        let el = document.getElementById(`fill-${qId}-${i}`);
        if (el.value.trim().toLowerCase() === ans.toLowerCase()) {
            el.style.borderColor = 'var(--correct)';
            el.style.backgroundColor = '#e6ffed';
        } else {
            allCorrect = false;
            el.style.borderColor = 'var(--incorrect)';
            el.style.backgroundColor = '#ffe6e6';
            if (!el.parentNode.querySelector(`.fill-hint-${i}`)) {
                let cSpan = document.createElement('span');
                cSpan.className = `fill-hint-${i}`;
                cSpan.innerHTML = ` <b style="color:var(--correct)">(${ans})</b>`;
                el.parentNode.insertBefore(cSpan, el.nextSibling);
            }
        }
    });

    if (allCorrect) playCorrect(); else playIncorrect();
    const expEl = document.getElementById(`exp-${qId}`);
    if (expEl) expEl.style.display = 'block';
}

function checkInputImmediate(qId) {
    if (isTestSubmitted) return;
    const q = quizData.find(item => item.id === qId);
    let el = document.getElementById(`input-${qId}`);
    let val = el.value.trim().toLowerCase();
    let isCurrentCorrect = q.correct.some(c => c.toLowerCase() === val);

    if (isCurrentCorrect) {
        el.style.borderColor = 'var(--correct)';
        el.style.backgroundColor = '#e6ffed';
        playCorrect();
    } else {
        el.style.borderColor = 'var(--incorrect)';
        el.style.backgroundColor = '#ffe6e6';
        playIncorrect();
        if (!el.parentNode.querySelector('.input-hint')) {
            let cSpan = document.createElement('span');
            cSpan.className = 'input-hint';
            cSpan.innerHTML = ` <br><b style="color:var(--correct)">Answer: ${q.correct[0]}</b>`;
            el.parentNode.insertBefore(cSpan, el.nextSibling);
        }
    }
    const expEl = document.getElementById(`exp-${qId}`);
    if (expEl) expEl.style.display = 'block';
}

function checkReorderImmediate(qId) {
    if (isTestSubmitted) return;
    const q = quizData.find(item => item.id === qId);
    const zone = document.getElementById(`zone-${qId}`);
    let sentence = Array.from(zone.children).map(el => el.innerText).join(' ').trim();

    if (sentence === q.correct) {
        zone.style.borderColor = 'var(--correct)';
        zone.style.backgroundColor = '#e6ffed';
        playCorrect();
    } else {
        zone.style.borderColor = 'var(--incorrect)';
        zone.style.backgroundColor = '#ffe6e6';
        playIncorrect();
        if (!zone.parentNode.querySelector('.reorder-hint')) {
            let cSpan = document.createElement('div');
            cSpan.className = 'reorder-hint';
            cSpan.innerHTML = `<b style="color:var(--correct)">Answer: ${q.correct}</b>`;
            zone.parentNode.insertBefore(cSpan, zone.nextSibling);
        }
    }
    const expEl = document.getElementById(`exp-${qId}`);
    if (expEl) expEl.style.display = 'block';
}

function moveWord(el, qId) {
    if (isTestSubmitted) return;
    const zone = document.getElementById(`zone-${qId}`);
    const bank = document.getElementById(`bank-${qId}`);
    if (el.parentElement.id === `bank-${qId}`) { zone.appendChild(el); } 
    else { bank.appendChild(el); }
}

function resetReorder(qId) {
    if (isTestSubmitted) return;
    const zone = document.getElementById(`zone-${qId}`);
    const bank = document.getElementById(`bank-${qId}`);
    while(zone.firstChild) { bank.appendChild(zone.firstChild); }
    zone.style.borderColor = 'var(--dora-blue)';
    zone.style.backgroundColor = '#F0F8FF';
    const hint = zone.parentNode.querySelector('.reorder-hint');
    if (hint) hint.remove();
}

function submitTest() {
    if (isTestSubmitted) return;
    if (!confirm("Are you sure you want to submit?")) return;
    
    clearInterval(timerInterval);
    isTestSubmitted = true;
    document.getElementById('submit-btn').style.display = 'none';

    let total = 42; 
    let correct = 0;
    let matrix = {};

    quizData.forEach(q => {
        let isCorrect = false;

        if (q.type === 'mcq') {
            if (!matrix[q.matrix]) matrix[q.matrix] = { total: 0, correct: 0 };
            matrix[q.matrix].total++;
            
            if (userAnswers[q.id] === q.correct) { isCorrect = true; correct++; matrix[q.matrix].correct++; }
            const correctOpt = document.getElementById(`opt-${q.id}-${q.correct}`);
            if (correctOpt) correctOpt.classList.add('correct');
            if (userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.correct) {
                const wrongOpt = document.getElementById(`opt-${q.id}-${userAnswers[q.id]}`);
                if (wrongOpt) wrongOpt.classList.add('incorrect');
            }
        }
        else if (q.type === 'matching') {
            for (let key in q.correct) {
                if (!matrix[q.matrix]) matrix[q.matrix] = { total: 0, correct: 0 };
                matrix[q.matrix].total++;
                
                let val = document.getElementById(`match-${q.id}-${key}`).value.trim();
                if (val === q.correct[key]) {
                    correct++; matrix[q.matrix].correct++;
                }
                document.getElementById(`match-${q.id}-${key}`).disabled = true;
            }
        }
        else if (q.type === 'fill') {
            q.correct.forEach((ans, i) => {
                if (!matrix[q.matrix]) matrix[q.matrix] = { total: 0, correct: 0 };
                matrix[q.matrix].total++;
                
                let el = document.getElementById(`fill-${q.id}-${i}`);
                if (el.value.trim().toLowerCase() === ans.toLowerCase()) {
                    correct++; matrix[q.matrix].correct++;
                }
                el.disabled = true;
            });
        }
        else if (q.type === 'input') {
            if (!matrix[q.matrix]) matrix[q.matrix] = { total: 0, correct: 0 };
            matrix[q.matrix].total++;
            
            let el = document.getElementById(`input-${q.id}`);
            let val = el.value.trim().toLowerCase();
            if (q.correct.some(c => c.toLowerCase() === val)) {
                correct++; matrix[q.matrix].correct++;
            }
            el.disabled = true;
        }
        else if (q.type === 'reorder') {
            if (!matrix[q.matrix]) matrix[q.matrix] = { total: 0, correct: 0 };
            matrix[q.matrix].total++;
            
            const zone = document.getElementById(`zone-${q.id}`);
            let sentence = Array.from(zone.children).map(el => el.innerText).join(' ').trim();
            if (sentence === q.correct) {
                correct++; matrix[q.matrix].correct++;
            }
        }
        
        document.getElementById(`exp-${q.id}`).style.display = 'block';
    });

    if (correct / total >= 0.5) { playCorrect(); fireConfetti(); } else { playIncorrect(); }
    
    // Generate Report
    document.getElementById('report-screen').style.display = 'block';
    document.getElementById('final-name').innerText = document.getElementById('student-name').value;
    document.getElementById('final-score').innerText = `${correct}/${total}`;
    
    // Thang điểm 10
    let score10 = ((correct / total) * 10).toFixed(1);
    document.getElementById('final-score-10').innerText = `Điểm số: ${score10} / 10`;

    let matrixTable = document.getElementById('matrix-body');
    let worstMatrix = { name: '', percent: 101 };

    for (const [key, value] of Object.entries(matrix)) {
        let percent = Math.round((value.correct / value.total) * 100);
        let badge = 'weakness'; let label = 'Weakness';
        if (percent > 80) { badge = 'mastered'; label = 'Mastered'; }
        else if (percent >= 50) { badge = 'practice'; label = 'Needs Practice'; }

        if (percent < worstMatrix.percent) { worstMatrix.percent = percent; worstMatrix.name = key; }

        matrixTable.innerHTML += `<tr><td><b>${key}</b></td><td>${percent}% (${value.correct}/${value.total})</td><td><span class="badge ${badge}">${label}</span></td></tr>`;
    }

    // Root Cause Analysis
    let advice = `Cô khen ngợi tinh thần làm bài của con! Tuy nhiên, con đang bị hổng kiến thức ở mảng <b>${worstMatrix.name}</b> (chỉ đạt ${worstMatrix.percent}%).<br><br>`;
    if (worstMatrix.name.includes("Ngữ âm")) advice += "Con cần ôn lại các quy tắc nhấn trọng âm của từ 2 âm tiết và từ có đuôi đặc biệt (-ese, -ish). Hãy dùng Cửa Thần Kỳ mở lại sách giáo khoa và nghe băng phát âm chuẩn nhé!";
    else if (worstMatrix.name.includes("Nghe hiểu")) advice += "Kỹ năng nghe của con cần luyện tập thêm. Hãy dùng Bánh mì chuyển ngữ để dịch nhanh các từ khóa (keywords) trong câu hỏi trước khi băng bắt đầu chạy nhé.";
    else if (worstMatrix.name.includes("Từ vựng")) advice += "Con bị nhầm lẫn ở các tình huống giao tiếp thực tế và từ vựng chỉ địa điểm/hoạt động. Hãy làm Bánh Trí Nhớ để học từ vựng theo cụm thay vì học từ đơn lẻ nhé.";
    else if (worstMatrix.name.includes("Ngữ pháp") || worstMatrix.name.includes("Reorder")) advice += "Cấu trúc câu của con chưa vững, đặc biệt là sở hữu cách và trật tự từ. Con hãy luyện viết các mẫu câu này ra vở để tay quen với cấu trúc giống như Nobita hay bị phạt chép bài vậy nha.";
    else advice += "Con hãy xem kỹ lại phần Giải thích chi tiết bên dưới bài làm để rút kinh nghiệm. Cố lên nhé!";

    document.getElementById('teacher-advice').innerHTML = advice;
    
    setTimeout(() => { document.getElementById('report-screen').scrollIntoView({ behavior: 'smooth' }); }, 500);
}

function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const pieces = [];
    for(let i=0; i<120; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            size: Math.random() * 12 + 6,
            color: ['#00A0E9', '#e3001b', '#ffd900', '#ffffff'][Math.floor(Math.random() * 4)],
            vy: Math.random() * 3 + 2,
            vx: Math.random() * 2 - 1
        });
    }
    function update() {
        ctx.clearRect(0,0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.vy; p.x += p.vx;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2);
            ctx.fill();
        });
        if(pieces.some(p => p.y < canvas.height)) requestAnimationFrame(update);
    }
    update();
}
